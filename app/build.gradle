plugins {
    id 'com.android.application'
}

android {
    namespace 'com.campusbill.app'
    compileSdk = 37

    defaultConfig {
        applicationId "com.campusbill.app"
        minSdk = 29
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
}

tasks.register("syncAssistantDocs", Copy) {
    from("${rootDir}/docs/assistant")
    include "SYSTEM_PROMPT.v0.1.md", "tools.schema.v0.1.json", "intent-control.v0.1.md",
            "think-protocol.v0.1.md", "emotion-map.v0.1.md"
    into("${projectDir}/src/main/assets/assistant")
}

def voskModelZip = layout.buildDirectory.file("generated/assets/vosk/vosk-model-small-cn-0.22.zip")

tasks.register("fetchVoskChineseModel") {
    def dest = voskModelZip
    outputs.upToDateWhen {
        def file = dest.get().asFile
        file.isFile() && file.length() > 30_000_000L
    }
    doLast {
        def file = dest.get().asFile
        if (file.isFile() && file.length() > 30_000_000L) {
            return
        }
        file.parentFile.mkdirs()
        def connection = new URL("https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip")
                .openConnection()
        connection.connectTimeout = 20000
        connection.readTimeout = 180000
        connection.inputStream.withCloseable { input ->
            file.newOutputStream().withCloseable { output ->
                output << input
            }
        }
        if (file.length() < 30_000_000L) {
            file.delete()
            throw new GradleException("Vosk 中文小模型下载不完整")
        }
    }
}

android.sourceSets.main.assets.srcDir("build/generated/assets")

tasks.named("preBuild").configure {
    dependsOn("syncAssistantDocs", "fetchVoskChineseModel")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'com.opencsv:opencsv:5.9'

    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.alphacephei:vosk-android:0.3.75'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // 桌面单测走带 Linux 原生库的 jar。Android 包仍用上面的 vosk-android。
    testImplementation 'com.alphacephei:vosk:0.3.45'
    testImplementation 'net.java.dev.jna:jna:5.18.1'
}
